<ion-grid class="notation-table ion-margin-vertical">
  @for (notation of notations; track notation.notation) {
  <ion-row class="ion-justify-content-center">
    <ion-col
      size="6"
      sizeMd="4"
      class="d-flex flex-column justify-content-center align-items-center"
      [style]="{
        borderRight: '0',
        borderBottom: $index === notations.length - 1 ? '0.2rem solid var(--ion-color-tertiary)' : '0',
        borderTopLeftRadius: $index === 0 ? '1rem' : '0',
        borderBottomLeftRadius: $index === notations.length - 1 ? '1rem' : '0'
      }"
    >
      <h1>{{ notation.notation }}</h1>
      <p class="px-4">{{ notation.description }}</p>
    </ion-col>
    <ion-col
      size="6"
      sizeMd="4"
      class="d-flex flex-column justify-content-center align-items-center"
      [style]="{
        borderBottom: $index === notations.length - 1 ? '0.2rem solid var(--ion-color-tertiary)' : '0',
        borderTopRightRadius: $index === 0 ? '1rem' : '0',
        borderBottomRightRadius: $index === notations.length - 1 ? '1rem' : '0'
      }"
    >
      <img [src]="notation.imgSrc" [alt]="notation.imgAlt" width="128" />
    </ion-col>
  </ion-row>
  }
</ion-grid>
