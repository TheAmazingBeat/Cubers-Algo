<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>2x2 Ortega</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">2x2 Ortega</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>
    <ion-row class="ion-justify-content-center w-full">
      <ion-col size="12" sizeLg="10">
        <app-algo-category
          categoryTitle="OLL"
          [algos]="oll"
        ></app-algo-category>
      </ion-col>
    </ion-row>

    <ion-row class="ion-justify-content-center w-full">
      <ion-col size="12" sizeLg="10">
        <app-algo-category
          categoryTitle="PBL"
          [algos]="pbl"
        ></app-algo-category>
      </ion-col>
      
    </ion-row>
  </ion-grid>
</ion-content>
