<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>2x2 Notations</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">2x2 Notations</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-notations-table [notations]="notations"> </app-notations-table>
</ion-content>
